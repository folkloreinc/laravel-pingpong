name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    # Authenticated downloads from GitHub have a higher rate limit
    COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

jobs:
    lint:
        name: Pint and Larastan
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Validate composer.json
              run: composer validate --strict

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            - name: Check code style
              run: vendor/bin/pint --test

            - name: Run static analysis
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

    tests:
        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4', '8.5']
                laravel: ['12.*', '13.*']
        steps:
            - uses: actions/checkout@v5

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Install dependencies
              run: |
                  composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
                  composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

            - name: Run tests
              run: vendor/bin/phpunit

    e2e:
        name: End to end
        runs-on: ubuntu-24.04
        env:
            # The Pingpong server the tests run against, built from source.
            PINGPONG_REF: main
        steps:
            - uses: actions/checkout@v5

            - uses: actions/checkout@v5
              with:
                  repository: folkloreinc/pingpong
                  ref: ${{ env.PINGPONG_REF }}
                  path: .pingpong

            - uses: actions/setup-node@v5
              with:
                  node-version-file: .pingpong/.nvmrc

            - name: Build Pingpong
              working-directory: .pingpong
              run: npm ci && npm run build

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - name: Install dependencies
              run: composer update --prefer-dist --no-interaction --no-progress

            # SQLite and a project. The variables of the tests go to the next steps.
            - name: Start Pingpong
              run: PINGPONG_CHECKOUT=.pingpong tests/EndToEnd/pingpong.sh up >> "$GITHUB_ENV"

            - name: Run the end-to-end tests
              run: vendor/bin/phpunit --testsuite EndToEnd --fail-on-skipped

            - name: Show Pingpong's logs
              if: failure()
              run: tests/EndToEnd/pingpong.sh logs
